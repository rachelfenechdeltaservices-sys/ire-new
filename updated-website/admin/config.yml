# GENERATED FILE - do not edit by hand.
# Edit _cms/cms-config.source.yml and run: python _cms/build.py
# The backend part (GitHub repository, branch, login URL) is added at runtime by backend.php
# from your private cms-config.php file.

backend:
  name: github
  auth_methods:
  - oauth
  commit_messages:
    create: 'CMS: create {{collection}} "{{slug}}"'
    update: 'CMS: update {{collection}} "{{slug}}"'
    delete: 'CMS: delete {{collection}} "{{slug}}"'
    uploadMedia: 'CMS: upload "{{path}}"'
    deleteMedia: 'CMS: delete "{{path}}"'
media_folder: assets/images/brands
public_folder: /assets/images/brands
app_title: Top 10 Irish Casino CMS
logo:
  src: /assets/images/favicon.png
show_preview_links: false
collections:
- name: offers
  label: Offers
  label_singular: Offer list
  icon: local_offer
  description: Sportsbook and casino offer lists. Drag offers to change their ranking.
  files:
  - name: sportsbook
    label: Sportsbook offers (homepage)
    file: content/offers-sportsbook.json
    fields:
    - name: subtitle
      label: Section label
      widget: string
    - name: heading
      label: Section heading
      widget: string
    - name: intro
      label: Section intro
      widget: text
      hint: You can use **bold** and [link text](page.html). {{site_name}}, {{email}}, {{domain}} and
        {{helpline}} are filled in automatically.
    - name: offers
      label: 'Offers (drag to change the order — #1 is the Top Pick)'
      label_singular: offer
      widget: list
      collapsed: true
      allow_reorder: true
      summary: '{{fields.brand}} — {{fields.headline}} {{fields.highlight}}'
      fields:
      - name: enabled
        label: Show on the website
        widget: boolean
        default: true
        hint: Switch off to hide this offer without deleting it.
      - name: brand
        label: Brand name
        widget: string
      - name: logo
        label: Logo
        widget: image
        hint: Transparent PNG or SVG works best. Shown on a dark background.
      - name: invert_logo
        label: Invert logo colours (for dark logos)
        widget: boolean
        default: false
        required: false
      - name: licence
        label: Licence number
        widget: string
        hint: e.g. GRAI-1195-RB-26-0001
      - name: review
        label: Review page
        widget: relation
        collection: reviews
        value_field: '{{slug}}'
        search_fields:
        - title
        - brand
        display_fields:
        - title
        required: false
        hint: Optional. Adds a "Read review" link and shows this offer on that review page.
      - name: rating
        label: Rating (out of 10)
        widget: number
        value_type: float
        min: 0
        max: 10
        step: 0.1
      - name: tag
        label: Badge (optional)
        widget: string
        required: false
        hint: e.g. Mobile Exclusive, Web Exclusive
      - name: headline
        label: Offer headline
        widget: string
        hint: White part, e.g. Bet €10
      - name: highlight
        label: Offer highlight
        widget: string
        hint: Green part, e.g. Get €50 in Free Bets
      - name: features
        label: Advantages
        widget: list
        hint: The first 3 are shown on mobile; the rest appear under "More info".
        field:
          name: feature
          label: Advantage
          widget: string
      - name: url
        label: Short link
        widget: string
        pattern:
        - ^(/[A-Za-z0-9._~/-]+|https?://.+)$
        - Use a short link like /link1 (or a full https:// address)
        hint: The link the Visit buttons use, e.g. /link1. Each offer needs its own short link; it is
          redirected to the affiliate URL by the .htaccess file.
      - name: redirect_to
        label: Affiliate destination (optional)
        widget: string
        required: false
        pattern:
        - ^(https?://.+)?$
        - Must start with https:// or http://
        hint: If filled in, the redirect from the short link to this URL is written into .htaccess automatically
          when the site is rebuilt. Leave empty if you manage the redirect in .htaccess yourself. Put
          {gclid} where the Google Ads click ID should go (e.g. https://partner.example/?c={gclid}); otherwise
          the visitor's query string is passed on.
      - name: tracking_id
        label: Tracking label
        widget: string
        required: false
        hint: Optional. Used for analytics (data-offer attribute), e.g. netbet-sportsbook. Leave empty
          to generate one.
      - name: terms
        label: Operator terms (significant T&Cs)
        widget: text
        hint: Copy the operator's terms exactly as provided by the operator.
